name: CI

on:
  push:
    branches: [main, des]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Ordem importa (core → cli → extension): o script raiz já ordena; NÃO usar --workspaces aqui.
      - run: npm run build
      - run: npx --prefix packages/core tsc -p packages/core/tsconfig.check.json
      - run: npx --prefix packages/cli tsc -p packages/cli/tsconfig.check.json
      - run: npx --prefix apps/extension tsc -p apps/extension/tsconfig.json --noEmit
      - run: npx --prefix packages/core vitest run --root packages/core --coverage
      - run: npx --prefix packages/cli vitest run --root packages/cli
      - name: Upload cobertura do Core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core-node${{ matrix.node }}
          path: packages/core/coverage
          if-no-files-found: ignore

  vscode-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Start Xvfb (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: Xvfb :99 &
      - run: npm ci
      # Ordem importa (core → cli → extension): o script raiz já ordena; NÃO usar --workspaces aqui.
      - run: npm run build
      - run: npm test --prefix apps/extension
        env:
          DISPLAY: ${{ matrix.os == 'ubuntu-latest' && ':99' || '' }}
